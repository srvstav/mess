# Proves the Windows path works end to end on a real Windows machine:
# setup.bat -> start.bat -> every page and endpoint -> demo.bat -> all tests.
name: windows-check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL 8.0 (like the MySQL Installer would)
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: "8.0"

      - name: Install Python 3.12 (like python.org would)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup.bat (first run, answers the questions)
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ""
        run: |
          (echo.& echo.& echo.) | call setup.bat
          if errorlevel 1 exit /b 1
          if not exist backend\.env exit /b 1

      - name: start.bat (in the background)
        shell: pwsh
        run: |
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "start.bat" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "server did not start" }
          "health: $($r | ConvertTo-Json -Compress)"

      - name: Every page and endpoint answers
        shell: pwsh
        run: |
          foreach ($p in "/", "/dashboard.html", "/credits.html", "/docs", "/menu", "/stats/today", "/admin/live") {
            $code = (Invoke-WebRequest "http://127.0.0.1:8000$p" -UseBasicParsing).StatusCode
            "$code  $p"
            if ($code -ne 200) { throw "$p returned $code" }
          }
          $menu = Invoke-RestMethod http://127.0.0.1:8000/menu
          if ($menu.slots.Count -ne 4) { throw "menu should have 4 meals" }

      - name: Full booking flow over HTTP (session, book, face scan, rating, auto-close)
        shell: pwsh
        run: |
          $api = "http://127.0.0.1:8000"
          # SMS login needs a real phone, so CI skips it: /auth/login must refuse junk, and the
          # Firebase token check itself is covered by the automated tests. The session is minted directly
          # for roster student 1 (phone 7000000001 in db/students.csv).
          $bad = try { Invoke-WebRequest "$api/auth/login" -Method Post -ContentType "application/json" -Body '{"id_token":"not-a-real-firebase-token"}' -UseBasicParsing } catch { $_.Exception.Response }
          if ([int]$bad.StatusCode -lt 400) { throw "/auth/login accepted a fake token" }
          $tok = (& backend\.venv\Scripts\python.exe -c "import sys; sys.path.insert(0, 'backend'); import auth; print(auth.make_token(1))").Trim()
          $h = @{ Authorization = "Bearer $tok" }
          "logged in as: $((Invoke-RestMethod "$api/me" -Headers $h).student.full_name)"
          $today = (Invoke-RestMethod "$api/health").today
          Invoke-RestMethod "$api/bookings" -Method Post -Headers $h -ContentType "application/json" -Body (@{meal_date=$today; slot_id=4; mess_id=2} | ConvertTo-Json) | Out-Null
          # The face terminal records the meal; then the student rates it; then the event's procedure closes meals.
          mysql -u root -e "INSERT INTO mess.attendance (student_id, meal_date, slot_id, mess_id) SELECT id, '$today', 4, 2 FROM mess.students WHERE phone = '7000000001';"
          Invoke-RestMethod "$api/ratings" -Method Post -Headers $h -ContentType "application/json" -Body (@{meal_date=$today; slot_id=4; stars=5} | ConvertTo-Json) | Out-Null
          mysql -u root -e "CALL mess.sp_close_finished_meals();"
          $live = Invoke-RestMethod "$api/admin/live"
          "activity rows: $($live.activity.Count)"
          $live.activity | Select-Object -First 6 | Format-Table -AutoSize | Out-String -Width 200

      - name: demo.bat (loads a realistic day)
        shell: cmd
        run: call demo.bat < nul

      - name: What Workbench would show (query 1 and 4 from demo_queries.sql)
        shell: cmd
        run: |
          mysql -u root -e "USE mess; SELECT id, at, event, detail FROM activity_log ORDER BY id DESC LIMIT 8; SELECT meal, mess, booked, cooked, served, no_shows, walk_ins, donate FROM v_meal_summary WHERE meal_date = CURDATE();"

      - name: Automated tests
        shell: cmd
        run: |
          backend\.venv\Scripts\python.exe -m pip install -q -r backend\requirements-dev.txt
          cd backend && .venv\Scripts\python.exe -m pytest -q

      - name: db/mess_complete.sql builds everything with no Python (the Workbench-only path)
        shell: cmd
        run: |
          mysql -u root < db\mess_complete.sql
          mysql -u root -e "SELECT (SELECT COUNT(*) FROM mess.students) students, (SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='mess') triggers_, (SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='mess') routines, (SELECT COUNT(*) FROM mess.bookings) bookings;"

      - name: reset.bat (wipe and rebuild)
        shell: cmd
        env:
          MYSQL_ROOT_PASSWORD: ""
        run: |
          echo YES| call reset.bat
          mysql -u root -e "SELECT COUNT(*) AS students_after_reset FROM mess.students;"
